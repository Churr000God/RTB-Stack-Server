version: '3.9'

services:
  web:
    image: nginx:latest
    container_name: rtb_web
    volumes:
      - ./RTB_Web/frontend:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    ports:
      - "80:80"
      - "443:443"
    restart: unless-stopped
    networks:
      - rtbnet

networks:
  rtbnet:
    external: true
