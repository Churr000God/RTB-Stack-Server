# ─────────────────────────────────────────────────────────
# TLS global (aplicado en todos los server HTTPS vía include)
# ─────────────────────────────────────────────────────────
ssl_protocols       TLSv1.2 TLSv1.3;
ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
ssl_prefer_server_ciphers off;
ssl_session_cache   shared:SSL:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;

# OCSP Stapling — requiere ssl_trusted_certificate con la cadena completa de LE
# Pendiente: añadir ssl_trusted_certificate cuando se consolide el pipeline de certs
# ssl_stapling        on;
# ssl_stapling_verify on;
# resolver            1.1.1.1 8.8.8.8 valid=60s;
# resolver_timeout    5s;

# ─────────────────────────────────────────────────────────
# Rate limiting — anti-bruteforce Nextcloud login
# ─────────────────────────────────────────────────────────
limit_req_zone $binary_remote_addr zone=nc_login:10m rate=10r/m;

# ─────────────────────────────────────────────────────────
# 80 → 443 (redirecciones permanentes para todos los hostnames)
# ─────────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name www.refacrtb.com.mx nube.refacrtb.com.mx office.refacrtb.com.mx mail.refacrtb.com.mx;
    return 301 https://$host$request_uri;
}

# (Opcional) catch-all por si llega algún hostname no declarado
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    return 301 https://$host$request_uri;
}

# ─────────────────────────────────────────────────────────
# WebSocket support
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# www.refacrtb.com.mx (landing institucional)
# ─────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.refacrtb.com.mx;

    ssl_certificate     /etc/letsencrypt/live/www.refacrtb.com.mx/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.refacrtb.com.mx/privkey.pem;

    # HSTS (solo si TODOS tus subdominios tienen HTTPS)
    add_header Strict-Transport-Security "max-age=15552000; includeSubDomains; preload" always;

    # Security headers
    add_header X-Content-Type-Options      "nosniff"                   always;
    add_header X-Frame-Options             "SAMEORIGIN"                always;
    add_header Referrer-Policy             "no-referrer"               always;
    add_header X-Permitted-Cross-Domain-Policies "none"                always;
    add_header X-Robots-Tag                "noindex, nofollow"         always;

    root /usr/share/nginx/html;

    # Anti-cache headers for development
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    add_header Pragma "no-cache";
    add_header Expires "0";
    index index.html;

    # Proxy para el backend API
    location /api/ {
        proxy_pass http://172.25.0.1:3000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Servir archivos estáticos del frontend
    location / {
        try_files $uri $uri/ =404;
    }
}

# ─────────────────────────────────────────────────────────
# Nextcloud – nube.refacrtb.com.mx
# ─────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name nube.refacrtb.com.mx;

    ssl_certificate     /etc/letsencrypt/live/nube.refacrtb.com.mx/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nube.refacrtb.com.mx/privkey.pem;

    # HSTS
    add_header Strict-Transport-Security "max-age=15552000; includeSubDomains; preload" always;

    # Security headers (Nextcloud espera estos desde el proxy)
    add_header X-Content-Type-Options      "nosniff"      always;
    add_header X-Frame-Options             "SAMEORIGIN"   always;
    add_header Referrer-Policy             "no-referrer"  always;
    add_header X-Permitted-Cross-Domain-Policies "none"   always;
    add_header X-Robots-Tag                "noindex, nofollow" always;

    # Tamaños/tiempos recomendados para WebDAV/Office
    client_max_body_size 1024m;
    proxy_read_timeout   3600;
    proxy_connect_timeout 3600;
    proxy_send_timeout    3600;

    # Redirecciones CalDAV/CardDAV
    location /.well-known/carddav { return 301 $scheme://$host/remote.php/dav; }
    location /.well-known/caldav  { return 301 $scheme://$host/remote.php/dav; }
    location ^~ /.well-known      { return 301 $scheme://$host/index.php$uri; }

    # Rate-limit endpoints de autenticación (complementa bruteforcesettings de NC)
    location ~ ^/index\.php/login {
        limit_req zone=nc_login burst=20 nodelay;
        proxy_pass http://nextcloud:80;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  443;
        proxy_set_header HTTPS "on";
    }
    location ~ ^/remote\.php/dav {
        limit_req zone=nc_login burst=30 nodelay;
        proxy_pass http://nextcloud:80;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  443;
        proxy_set_header HTTPS "on";
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    # Proxy a contenedor Nextcloud
    location / {
        proxy_pass http://nextcloud:80;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;   # ¡forzado a https!
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  443;
        proxy_set_header HTTPS "on";

        # WebSocket/Upgrade
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}

