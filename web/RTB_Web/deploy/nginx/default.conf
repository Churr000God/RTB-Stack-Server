## Mapa para WebSockets
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

## Configuración común SSL
ssl_protocols TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers on;
ssl_session_cache shared:SSL:10m;

## 1) Sitio principal: www.refacrtb.com.mx / refacrtb.com.mx
server {
  listen 80;
  server_name refacrtb.com.mx www.refacrtb.com.mx;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl http2;
  server_name refacrtb.com.mx www.refacrtb.com.mx;

  ssl_certificate /etc/ssl/www.refacrtb.com.mx/fullchain.pem;
  ssl_certificate_key /etc/ssl/www.refacrtb.com.mx/privkey.pem;

  root /usr/share/nginx/html;
  index index.html;

  # Seguridad básica
  add_header X-Content-Type-Options nosniff;
  add_header X-Frame-Options SAMEORIGIN;
  add_header Referrer-Policy strict-origin-when-cross-origin;
  add_header X-XSS-Protection "1; mode=block";

  # Sitio estático
  location / {
    try_files $uri $uri/ /index.html;
  }
}

## 2) Nextcloud: nube.refacrtb.com.mx
server {
  listen 80;
  server_name nube.refacrtb.com.mx;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl http2;
  server_name nube.refacrtb.com.mx;

  ssl_certificate /etc/ssl/nube.refacrtb.com.mx/fullchain.pem;
  ssl_certificate_key /etc/ssl/nube.refacrtb.com.mx/privkey.pem;

  client_max_body_size 1024M;
  proxy_read_timeout 1200s;
  proxy_connect_timeout 300s;
  proxy_send_timeout 1200s;

  location / {
    proxy_pass http://nextcloud:80;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }

  # WebDAV
  location = /robots.txt { allow all; log_not_found off; access_log off; }
  location ~ ^/(?:\.|autotest|occ|issue|ind|db_structure|console) { deny all; }
}

