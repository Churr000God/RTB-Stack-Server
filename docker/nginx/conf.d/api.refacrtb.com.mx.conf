upstream backend_api {
    server api:8000;
}

server {
    listen 443 ssl;
    server_name api.refacrtb.com.mx;

    ssl_certificate /etc/letsencrypt/live/api.refacrtb.com.mx/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.refacrtb.com.mx/privkey.pem;

    location / {
        proxy_pass http://backend_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

