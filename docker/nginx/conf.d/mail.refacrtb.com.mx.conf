server {
    listen 443 ssl;
    server_name mail.refacrtb.com.mx;

    ssl_certificate /etc/letsencrypt/live/mail.refacrtb.com.mx/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mail.refacrtb.com.mx/privkey.pem;

    location / {
        proxy_pass http://mailu-front-1:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

