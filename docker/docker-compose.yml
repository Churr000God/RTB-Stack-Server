services:

  web:
    image: nginx:1            # 1.29.0 (Jul-2025); :1 recibe parches dentro del major (B5.4)
    container_name: rtb_web
    volumes:
      - ../web/RTB_Web/frontend:/usr/share/nginx/html:ro
      - ../web/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro   # webroot ACME challenge (certbot sin downtime)
    ports:
      - "80:80"
      - "443:443"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256m
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - rtbnet

  nextcloud:
    image: nextcloud:31       # 31.0.7 (Jul-2025); :31 recibe parches 31.x (B5.4)
    container_name: nextcloud
    volumes:
      - ../nextcloud/data:/var/www/html
    environment:
      - NEXTCLOUD_ADMIN_USER=${NEXTCLOUD_ADMIN_USER}
      - NEXTCLOUD_ADMIN_PASSWORD=${NEXTCLOUD_ADMIN_PASSWORD}
      - NEXTCLOUD_TRUSTED_DOMAINS=nube.refacrtb.com.mx
      - POSTGRES_HOST=postgres
      - POSTGRES_DB=nextcloud
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy   # espera readiness real de Postgres (B5.3)
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 4g
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/status.php"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - rtbnet

  portainer:
    image: portainer/portainer-ce:lts  # canal LTS estable; no tiene tag :2 en registry (B5.4)
    container_name: portainer
    ports:
      - "127.0.0.1:9443:9443"   # Solo localhost — acceso por túnel SSH (B3.1/B3.6)
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256m
    # healthcheck: imagen scratch sin shell/wget/curl — restart: unless-stopped cubre fallos
    networks:
      - rtbnet

  postgres:
    image: postgres:15        # 15.13 (ya pinado a major) (B5.4)
    container_name: postgres
    volumes:
      - ../db/data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d nextcloud"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - rtbnet

  collabora:
    image: collabora/code     # Sin tag semver estable upstream; SHA Jul-2025 (B5.4)
    container_name: collabora
    restart: unless-stopped
    cap_add:
      - MKNOD
    environment:
      - domain=nube\\.refacrtb\\.com\\.mx
      - username=${COLLABORA_USERNAME}
      - password=${COLLABORA_PASSWORD}
      - extra_params=--o:ssl.enable=false
    expose:
      - "9980"    # Solo red interna rtbnet — nginx proxea office.refacrtb.com.mx (B3.6)
    deploy:
      resources:
        limits:
          memory: 2g
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9980/hosting/discovery"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - rtbnet

  roundcube:
    image: roundcube/roundcubemail:latest-apache   # 1.6.x (Jun-2026, reciente) (B5.4)
    container_name: roundcube
    restart: unless-stopped
    environment:
      - ROUNDCUBEMAIL_DEFAULT_HOST=ssl://mail.refacrtb.com.mx
      - ROUNDCUBEMAIL_DEFAULT_PORT=993
      - ROUNDCUBEMAIL_SMTP_SERVER=tls://mail.refacrtb.com.mx
      - ROUNDCUBEMAIL_SMTP_PORT=587
      - ROUNDCUBEMAIL_DB_TYPE=sqlite
      - ROUNDCUBEMAIL_PLUGINS=archive,zipdownload,managesieve
      - ROUNDCUBEMAIL_UPLOAD_MAX_FILESIZE=100M
    volumes:
      - roundcube_data:/var/www/html
    deploy:
      resources:
        limits:
          memory: 512m
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - rtbnet


networks:
  rtbnet:
    external: true

volumes:
  roundcube_data:
